name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build API image
        run: |
          docker build \
            -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-api:${{ github.sha }} \
            -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-api:latest \
            ./api

      - name: Push API image
        run: |
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-api:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-api:latest

      - name: Update API Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_API_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-api:${{ github.sha }}

      - name: Build Web image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-web:${{ github.sha }} \
            -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-web:latest \
            ./web

      - name: Push Web image
        run: |
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-web:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-web:latest

      - name: Update Web Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_WEB_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/cpp-web:${{ github.sha }}