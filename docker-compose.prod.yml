services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: client_project_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Client Project Portal"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: client_project_portal
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      - postgres
      - redis
    volumes:
      - api_storage:/var/www/html/storage

  api_nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "8081:80"
    depends_on:
      - api_nginx

volumes:
  postgres_prod_data:
  api_storage: